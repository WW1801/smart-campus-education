<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晴空校园 · 三版对比</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f6;color:#263e46;font:14px/1.5 "PingFang SC","Microsoft YaHei",sans-serif}header{padding:30px 26px;background:#35515b;color:#fff}h1{margin:0 0 7px;font-size:29px}header p{margin:0;color:#dbe8e5}.tabs{display:flex;gap:8px;padding:14px 20px;background:#e9f0ee;overflow:auto}.tabs button{flex:none;min-height:44px;border:0;border-radius:12px;padding:8px 14px;color:#35515b;background:#fff;cursor:pointer}.tabs button.active{color:#fff;background:#2f8f8a}.frame{width:100%;height:calc(100vh - 151px);border:0;background:#fff}</style></head><body><header><h1>晴空校园 · 管理员首页三版对比</h1><p>三版共享同一视觉系统，只改变信息架构和操作节奏。</p></header><nav class="tabs"><button class="active" data-src="admin-sunny-campus-portal.html">A · 服务门户</button><button data-src="admin-sunny-campus-flow.html">B · 教学调度</button><button data-src="admin-sunny-campus-focus.html">C · 行动工作台</button></nav><iframe class="frame" id="preview" title="晴空校园版本预览" src="admin-sunny-campus-portal.html"></iframe><script>const frame=document.getElementById('preview');document.querySelectorAll('.tabs button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.tabs button').forEach(item=>item.classList.remove('active'));button.classList.add('active');frame.src=button.dataset.src}))</script></body></html>
